name: Deploy Codebase portal

on:
  push:
    branches: [main]
    paths:
      - "online_page/**"
      - "tools/site/build_public_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public pages
        run: python3 tools/site/build_public_site.py --output "$RUNNER_TEMP/public-site"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
