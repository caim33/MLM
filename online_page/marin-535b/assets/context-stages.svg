<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8aa69b"/></marker></defs><rect width="100%" height="100%" fill="#f5f7ef"/><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#153442} .tiny{font-size:12px;fill:#657e84}.title{font-size:21px;font-weight:600}.sub{font-size:14px;fill:#647b80}.line{stroke:#8aa69b;stroke-width:2;fill:none;marker-end:url(#a)}</style><text x="35" y="40" class="title">主训练、262K 扩展、SFT 是不同阶段</text><text x="35" y="66" class="sub">阶段图 · 方框宽度和横向距离不表示时长或预算</text><rect x="35" y="110" width="210" height="120" fill="white" rx="7" stroke="#c3d6cb"/><rect x="35" y="110" width="210" height="5" fill="#057f7a" rx="2"/><text x="53" y="148" class="title">4K 主训练</text><text x="53" y="177" font-size="13">起始长度 4,096</text><text x="53" y="203" class="tiny">初始配方 → 中期数据调整</text><rect x="295" y="110" width="210" height="120" fill="white" rx="7" stroke="#c3d6cb"/><rect x="295" y="110" width="210" height="5" fill="#057f7a" rx="2"/><text x="313" y="148" class="title">16K 主训练</text><text x="313" y="177" font-size="13">16,384 tokens</text><text x="313" y="203" class="tiny">step 257,553 起</text><rect x="555" y="110" width="210" height="120" fill="white" rx="7" stroke="#c3d6cb"/><rect x="555" y="110" width="210" height="5" fill="#057f7a" rx="2"/><text x="573" y="148" class="title">65K 主训练</text><text x="573" y="177" font-size="13">65,536 tokens</text><text x="573" y="203" class="tiny">step 372,000 起</text><path class="line" d="M250 170 H286"/><path class="line" d="M510 170 H546"/><text x="35" y="271" class="sub">主预训练合计 18T · step 390,251 完成 → 末期 checkpoint averaging</text><rect x="295" y="335" width="265" height="120" fill="white" rx="7" stroke="#c3d6cb"/><rect x="295" y="335" width="265" height="5" fill="#057f7a" rx="2"/><text x="313" y="373" class="title">262K · Global 1.